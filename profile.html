<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* CSS stays exactly the same as our previous successful version */
        :root { --primary: #2563eb; --whatsapp: #25D366; --verified: #059669; --bg-gray: #f3f4f6; --text-dark: #1f2937; --text-muted: #6b7280; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-gray); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .profile-card { background: white; width: 100%; max-width: 380px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; position: relative; display: none; }
        .card-header { padding: 30px 20px 10px; text-align: center; position: relative; }
        .profile-img-container { width: 110px; height: 110px; margin: 0 auto 15px; position: relative; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-dot { width: 16px; height: 16px; background: #d1d5db; border: 3px solid white; border-radius: 50%; position: absolute; bottom: 8px; right: 8px; }
        .status-active .status-dot { background: #10b981; box-shadow: 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0); } }
        .card-body { padding: 0 24px 24px; text-align: center; }
        .name-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 2px; }
        .name { font-size: 1.25rem; font-weight: 700; color: var(--text-dark); }
        .runner-id-badge { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; display: block; }
        .label-stack { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 12px; }
        .verification-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: inline-block; padding: 2px 8px; border-radius: 12px; }
        .label-verified { background: #d1fae5; color: var(--verified); }
        .label-unverified { background: #fee2e2; color: #ef4444; }
        .uniparcels-pill { display: none; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 12px; background: #fef3c7; color: #92400e; border: 1px solid #fbbf24; }
        .tags-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .tag { background: #eff6ff; color: var(--primary); font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 8px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: #f9fafb; padding: 15px; border-radius: 16px; margin-bottom: 20px; text-align: left; }
        .info-item label { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
        .info-item span { font-size: 0.85rem; font-weight: 600; color: var(--text-dark); }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.2s; text-decoration: none; }
        .btn-whatsapp { background: var(--whatsapp); color: white; }
        .btn-charge { background: white; color: var(--text-dark); border: 1px solid #e5e7eb; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); display: none; z-index: 1500; overflow-y: auto; padding: 40px 20px; align-items: center; justify-content: center; }
        .receipt { background: #fff; width: 100%; max-width: 340px; padding: 30px 20px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); font-family: 'Courier Prime', monospace; color: #1a1a1a; margin: auto; animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .receipt * { font-family: 'Courier Prime', monospace; }
        .receipt::after { content: ""; position: absolute; left: 0; bottom: -10px; width: 100%; height: 10px; background: linear-gradient(-45deg, transparent 5px, white 5px), linear-gradient(45deg, transparent 5px, white 5px); background-size: 10px 10px; }
        .receipt-header { text-align: center; border-bottom: 1px dashed #000; padding-bottom: 15px; margin-bottom: 15px; }
        .receipt-body { font-size: 0.95rem; line-height: 1.6; }
        .receipt-body p { margin-bottom: 12px; }
        .receipt-body a { color: var(--primary); word-break: break-all; text-decoration: underline; }
        .close-overlay { display: block; margin-top: 25px; text-align: center; color: #ef4444; font-size: 0.8rem; font-weight: bold; text-decoration: underline; cursor: pointer; letter-spacing: 1px; }
        .loader-container { text-align: center; color: var(--text-muted); padding-top: 50px;}
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="loadingUI" class="loader-container">
        <div class="spinner"></div>
        <p>Loading Profile...</p>
    </div>

    <div class="overlay" id="receiptOverlay" onclick="toggleReceipt(false)">
        <div class="receipt" onclick="event.stopPropagation()">
            <div class="receipt-header">
                <strong>OFFICIAL RECEIPT</strong><br>
                <small>RUNNER ID: <span id="receiptRunnerId"></span></small><br>
                <small id="receiptDate" style="font-size: 0.65rem; opacity: 0.7;"></small>
            </div>
            <div class="receipt-body" id="markdownContent"></div>
            <span class="close-overlay" onclick="toggleReceipt(false)">[ CLOSE ]</span>
        </div>
    </div>

    <div class="profile-card" id="mainCard">
        <div class="card-header" id="headerContainer">
            <div class="profile-img-container">
                <img src="" class="profile-img" id="profileImg">
                <div class="status-dot"></div>
            </div>
            <div class="name-row">
                <h1 class="name" id="studentName"></h1>
            </div>
            <span class="runner-id-badge" id="cardRunnerId"></span>
            <div class="label-stack">
                <div class="verification-label" id="verifiedLabel"></div>
                <div class="uniparcels-pill" id="uniparcelsPill">🎓 UniParcels</div>
                <div id="expiredBadge" style="display:none; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; padding:2px 8px; border-radius:12px; background:#fee2e2; color:#dc2626;">Tamat Tempoh</div>
            </div>
        </div>
        <div class="card-body">
            <p id="description" style="font-size: 0.9rem; color: #6b7280; margin-bottom: 15px;"></p>
            <div class="tags-container" id="tagsContainer"></div>
            <div class="info-grid">
                <div class="info-item"><label>Duration</label><span id="duration"></span></div>
                <div class="info-item"><label>Valid Until</label><span id="validUntil"></span></div>
                <div class="info-item" id="registeredRow" style="display:none; grid-column:1/-1;">
                    <label>Ahli Sejak</label>
                    <span id="registeredOn"></span>
                </div>
            </div>
            <div style="background:#f9fafb; padding:12px 15px; border-radius:16px; margin-bottom:20px; text-align:left;">
                <div style="font-size:0.7rem; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;">Maklumat Perkhidmatan</div>

                <div style="display:flex; align-items:flex-start; gap:8px; margin-bottom:8px;">
                    <i class="fas fa-user-check" style="color:#6b7280; width:14px; margin-top:3px;"></i>
                    <div>
                        <div style="font-size:0.7rem; color:#9ca3af; text-transform:uppercase; letter-spacing:0.05em;">Kriteria Pelanggan</div>
                        <div id="kriteria" style="font-size:0.85rem; font-weight:600; color:var(--text-dark);"></div>
                    </div>
                </div>

                <div id="kawasanItem" style="display:none; align-items:flex-start; gap:8px; margin-bottom:8px;">
                    <i class="fas fa-map-marker-alt" style="color:#6b7280; width:14px; margin-top:3px;"></i>
                    <div>
                        <div style="font-size:0.7rem; color:#9ca3af; text-transform:uppercase; letter-spacing:0.05em;">Kawasan</div>
                        <div id="kawasan" style="font-size:0.85rem; font-weight:600; color:var(--text-dark);"></div>
                    </div>
                </div>

                <div id="availabilityItem" style="display:none; align-items:flex-start; gap:8px;">
                    <i class="fas fa-clock" style="color:#6b7280; width:14px; margin-top:3px;"></i>
                    <div>
                        <div style="font-size:0.7rem; color:#9ca3af; text-transform:uppercase; letter-spacing:0.05em;">Waktu Operasi</div>
                        <div id="availability" style="font-size:0.85rem; font-weight:600; color:var(--text-dark);"></div>
                    </div>
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-charge" onclick="toggleReceipt(true)"><i class="fas fa-receipt"></i> Service Details & Charges</button>
                <a href="#" class="btn btn-whatsapp" id="whatsappBtn"><i class="fab fa-whatsapp"></i> Hire Now</a>
            </div>
        </div>
    </div>

<script>
    const DATA_SOURCE = "runners.json"; 
    let studentProfile = {};

    async function init() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        
        try {
            const response = await fetch(DATA_SOURCE);
            const data = await response.json();
            studentProfile = data.find(r => r.runnerId === id);

            if (studentProfile) render();
            else document.getElementById('loadingUI').innerText = "Runner Not Found";
        } catch (e) {
            document.getElementById('loadingUI').innerText = "Error Loading Data";
        }
    }

    function render() {
        document.getElementById('loadingUI').style.display = "none";
        document.getElementById('mainCard').style.display = "block";

        document.getElementById('studentName').innerText = studentProfile.name;
        document.getElementById('cardRunnerId').innerText = "ID: " + studentProfile.runnerId;
        document.getElementById('description').innerText = studentProfile.description;
        document.getElementById('duration').innerText = studentProfile.duration;
        document.getElementById('validUntil').innerText = studentProfile.validUntil;

        if (studentProfile.registeredOn) {
            const duration = calcDuration(studentProfile.registeredOn);
            const display = duration ? `${studentProfile.registeredOn} (${duration})` : studentProfile.registeredOn;
            document.getElementById('registeredOn').innerText = display;
            document.getElementById('registeredRow').style.display = '';
        }
        document.getElementById('profileImg').src = studentProfile.profilePic;

        const isVerified = String(studentProfile.isVerified).toLowerCase() === 'true';
        const vLabel = document.getElementById('verifiedLabel');
        vLabel.innerText = isVerified ? "Verified Runner" : "Unverified";
        vLabel.className = "verification-label " + (isVerified ? "label-verified" : "label-unverified");

        if (String(studentProfile.isActive).toLowerCase() === 'true') {
            document.getElementById('headerContainer').classList.add('status-active');
        }

        if (String(studentProfile.isUniParcels).toLowerCase() === 'true') {
            document.getElementById('uniparcelsPill').style.display = 'inline-block';
        }

        if (isExpired(studentProfile.validUntil)) {
            document.getElementById('expiredBadge').style.display = 'inline-block';
        }

        const tagsContainer = document.getElementById('tagsContainer');
        studentProfile.tags.split(',').forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.innerText = tag.trim();
            tagsContainer.appendChild(span);
        });

        const kriteriaMap = {
            'Wanita': 'Eksklusif untuk Pelanggan Wanita Sahaja',
            'Lelaki': 'Eksklusif untuk Pelanggan Lelaki Sahaja',
            'Terbuka': 'Terbuka kepada Semua (Lelaki & Perempuan)'
        };
        document.getElementById('kriteria').innerText =
            kriteriaMap[studentProfile.kriteriaP] || 'Terbuka kepada Semua (Lelaki & Perempuan)';

        if (studentProfile.kawasan) {
            document.getElementById('kawasan').innerText = studentProfile.kawasan;
            document.getElementById('kawasanItem').style.display = 'flex';
        }

        if (studentProfile.availability) {
            document.getElementById('availability').innerHTML = studentProfile.availability
                .split('|').map(s => s.trim()).join('<br>');
            document.getElementById('availabilityItem').style.display = 'flex';
        }

        const cleanPhone = String(studentProfile.phone).replace(/\D/g,'');
        document.getElementById('whatsappBtn').href = `https://wa.me/${cleanPhone}?text=Hi ${studentProfile.name}, I need a delivery.`;
    }

    function calcDuration(registeredOn) {
        const start = new Date(registeredOn);
        if (isNaN(start)) return '';
        const now = new Date();

        let years = now.getFullYear() - start.getFullYear();
        let months = now.getMonth() - start.getMonth();
        let days = now.getDate() - start.getDate();

        if (days < 0) {
            months--;
            days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        }
        if (months < 0) { years--; months += 12; }

        const totalDays = Math.floor((now - start) / 86400000);

        if (totalDays < 60) return `${totalDays} hari`;

        if (years < 1) {
            return days > 0 ? `${months} bulan ${days} hari` : `${months} bulan`;
        }

        let parts = `${years} tahun`;
        if (months > 0) parts += ` ${months} bulan`;
        if (days > 0) parts += ` ${days} hari`;
        return parts;
    }

    function isExpired(validUntil) {
        if (!validUntil) return false;
        const d = new Date(validUntil);
        if (isNaN(d)) return false;
        const endOfMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59);
        return new Date() > endOfMonth;
    }

    function toggleReceipt(show) {
        const overlay = document.getElementById('receiptOverlay');
        overlay.style.display = show ? 'flex' : 'none';
        if (show) {
            marked.setOptions({ breaks: true, gfm: true });
            document.getElementById('markdownContent').innerHTML = marked.parse(studentProfile.serviceDetails || "");
            document.getElementById('receiptRunnerId').innerText = studentProfile.runnerId;
            document.getElementById('receiptDate').innerText = new Date().toLocaleString();
            document.body.style.overflow = 'hidden';
        } else {
            document.body.style.overflow = 'auto';
        }
    }

    init();
</script>
</body>
</html>
