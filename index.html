<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Runner Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --text: #1f2937; }

        /* Mobile-first base */
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
        .container { max-width: 1100px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.4rem; font-weight: 700; }
        .header p { font-size: 0.85rem; color: #6b7280; margin-top: 4px; }

        /* Search Bar */
        .search-container { position: relative; max-width: 520px; margin: 0 auto 20px; }
        .search-input { width: 100%; padding: 13px 45px; border-radius: 12px; border: 1px solid #ddd; font-size: 1rem; }
        .search-icon { position: absolute; left: 15px; top: 16px; color: #999; }

        /* Grid — 2 columns on mobile */
        .runner-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        /* Card */
        .runner-card {
            background: white; border-radius: 16px; padding: 14px 10px; text-align: center;
            text-decoration: none; color: inherit; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative;
        }
        .runner-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }

        .card-img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid #eee; }
        .card-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; display: block; line-height: 1.3; }

        /* Status */
        .grid-status { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; background: #d1d5db; }
        .status-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .grid-id { font-size: 0.65rem; color: #6b7280; display: block; margin-bottom: 2px; }
        .uniparcels-mini { display: inline-block; background: #fef3c7; color: #92400e; font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; margin-top: 4px; border: 1px solid #fbbf24; }

        /* Skeleton */
        .skeleton { background: #e5e7eb; border-radius: 16px; height: 140px; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* Tablet — 3 columns */
        @media (min-width: 480px) {
            .runner-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
            .header h1 { font-size: 1.65rem; }
            .header p { font-size: 0.9rem; }
            .card-img { width: 70px; height: 70px; }
            .card-name { font-size: 0.9rem; }
        }

        /* Desktop — auto-fill */
        @media (min-width: 768px) {
            body { padding: 28px 24px; }
            .header { margin-bottom: 28px; }
            .header h1 { font-size: 2rem; }
            .runner-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 20px; }
            .runner-card { padding: 18px 14px; }
            .card-img { width: 80px; height: 80px; }
            .card-name { font-size: 0.95rem; }
            .search-container { margin-bottom: 28px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Unija Runners</h1>
        <p>Verified delivery services on campus</p>
    </div>

    <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or area...">
    </div>

    <div id="runnerGrid" class="runner-grid">
        <!-- Skeleton Loaders -->
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
</div>

<script>
    const DATA_SOURCE = "runners.json"; // This file will be generated by GitHub Actions
    let allRunners = [];

    async function loadRunners() {
        try {
            const response = await fetch(DATA_SOURCE);
            allRunners = await response.json();
            renderGrid(allRunners);
        } catch (e) {
            console.error("Failed to load runners. Ensure runners.json exists.");
        }
    }

    function renderGrid(data) {
        const grid = document.getElementById('runnerGrid');
        grid.innerHTML = data.map(runner => `
            <a href="profile?id=${runner.runnerId}" class="runner-card">
                <img src="${runner.profilePic}" class="card-img" alt="${runner.name}">
                <span class="card-name">${runner.name}</span>
                <span class="grid-id">${runner.runnerId}</span>
                ${String(runner.isUniParcels).toLowerCase() === 'true' ? '<span class="uniparcels-mini">🎓 UniParcels</span>' : ''}
                <div style="margin-top:8px; font-size: 0.75rem;">
                    <span class="grid-status ${String(runner.isActive).toLowerCase() === 'true' ? 'status-online' : ''}"></span>
                    ${String(runner.isActive).toLowerCase() === 'true' ? 'Active Now' : 'Offline'}
                </div>
            </a>
        `).join('');
    }

    // Search Logic
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allRunners.filter(r => 
            r.name.toLowerCase().includes(term) || 
            r.description.toLowerCase().includes(term)
        );
        renderGrid(filtered);
    });

    loadRunners();
</script>
</body>
</html>
