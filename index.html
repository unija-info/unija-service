<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Runner Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --text: #1f2937; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        
        /* Search Bar */
        .search-container { position: relative; max-width: 500px; margin: 0 auto 30px; }
        .search-input { width: 100%; padding: 15px 45px; border-radius: 12px; border: 1px solid #ddd; font-size: 1rem; }
        .search-icon { position: absolute; left: 15px; top: 18px; color: #999; }

        /* Grid System */
        .runner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }

        /* Mini Card Design */
        .runner-card { 
            background: white; border-radius: 16px; padding: 15px; text-align: center; 
            text-decoration: none; color: inherit; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative;
        }
        .runner-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }

        .card-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid #eee; }
        .card-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; display: block; }
        
        /* Status Dot in Grid */
        .grid-status { 
            width: 10px; height: 10px; border-radius: 50%; display: inline-block; 
            margin-right: 5px; background: #d1d5db; 
        }
        .status-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .grid-id { font-size: 0.7rem; color: #6b7280; display: block; }

        /* Skeleton Loader */
        .skeleton { background: #e5e7eb; border-radius: 16px; height: 150px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        @media (min-width: 600px) { .runner-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Student Runners</h1>
        <p>Verified delivery services on campus</p>
    </div>

    <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or area...">
    </div>

    <div id="runnerGrid" class="runner-grid">
        <!-- Skeleton Loaders -->
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
</div>

<script>
    const DATA_SOURCE = "runners.json"; // This file will be generated by GitHub Actions
    let allRunners = [];

    async function loadRunners() {
        try {
            const response = await fetch(DATA_SOURCE);
            allRunners = await response.json();
            renderGrid(allRunners);
        } catch (e) {
            console.error("Failed to load runners. Ensure runners.json exists.");
        }
    }

    function renderGrid(data) {
        const grid = document.getElementById('runnerGrid');
        grid.innerHTML = data.map(runner => `
            <a href="profile.html?id=${runner.runnerId}" class="runner-card">
                <img src="${runner.profilePic}" class="card-img" alt="${runner.name}">
                <span class="card-name">${runner.name}</span>
                <span class="grid-id">${runner.runnerId}</span>
                <div style="margin-top:8px; font-size: 0.75rem;">
                    <span class="grid-status ${String(runner.isActive).toLowerCase() === 'true' ? 'status-online' : ''}"></span>
                    ${String(runner.isActive).toLowerCase() === 'true' ? 'Active Now' : 'Offline'}
                </div>
            </a>
        `).join('');
    }

    // Search Logic
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allRunners.filter(r => 
            r.name.toLowerCase().includes(term) || 
            r.description.toLowerCase().includes(term)
        );
        renderGrid(filtered);
    });

    loadRunners();
</script>
</body>
</html>
