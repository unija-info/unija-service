<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Runner Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --text: #1f2937; }

        /* Mobile-first base */
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
        .container { max-width: 1100px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.4rem; font-weight: 700; }
        .header p { font-size: 0.85rem; color: #6b7280; margin-top: 4px; }

        /* Search Bar */
        .search-container { position: relative; max-width: 520px; margin: 0 auto 20px; }
        .search-input { width: 100%; padding: 13px 45px; border-radius: 12px; border: 1px solid #ddd; font-size: 1rem; }
        .search-icon { position: absolute; left: 15px; top: 16px; color: #999; }

        /* Grid — 2 columns on mobile */
        .runner-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        /* Card */
        .runner-card {
            background: white; border-radius: 16px; padding: 14px 10px; text-align: center;
            text-decoration: none; color: inherit; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative;
        }
        .runner-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }

        .card-img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid #eee; }
        .card-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; display: block; line-height: 1.3; }

        /* Status */
        .grid-status { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; background: #d1d5db; }
        .status-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .grid-id { font-size: 0.65rem; color: #6b7280; display: block; margin-bottom: 2px; }
        .uniparcels-mini { display: inline-block; background: #fef3c7; color: #92400e; font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; margin-top: 4px; border: 1px solid #fbbf24; }
        .expired-mini { display: inline-block; background: #fee2e2; color: #dc2626; font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; margin-top: 4px; border: 1px solid #fca5a5; }

        /* Filter Bar */
        .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; max-width: 720px; margin: 0 auto 20px; justify-content: center; }
        .filter-pill {
            background: white; border: 1.5px solid #d1d5db; border-radius: 20px;
            padding: 5px 12px; font-size: 0.78rem; font-weight: 600;
            cursor: pointer; color: #6b7280; font-family: 'Inter', sans-serif;
            transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
        }
        .filter-pill:hover { border-color: #2563eb; color: #2563eb; }
        .filter-pill.active { background: #2563eb; border-color: #2563eb; color: white; }
        .filter-divider { width: 100%; height: 0; }
        .dot-active { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }

        /* Skeleton */
        .skeleton { background: #e5e7eb; border-radius: 16px; height: 140px; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* Tablet — 3 columns */
        @media (min-width: 480px) {
            .runner-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
            .header h1 { font-size: 1.65rem; }
            .header p { font-size: 0.9rem; }
            .card-img { width: 70px; height: 70px; }
            .card-name { font-size: 0.9rem; }
        }

        /* Desktop — auto-fill */
        @media (min-width: 768px) {
            body { padding: 28px 24px; }
            .header { margin-bottom: 28px; }
            .header h1 { font-size: 2rem; }
            .runner-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 20px; }
            .runner-card { padding: 18px 14px; }
            .card-img { width: 80px; height: 80px; }
            .card-name { font-size: 0.95rem; }
            .search-container { margin-bottom: 28px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Unija Runners</h1>
        <p>Verified delivery services on campus</p>
    </div>

    <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or area...">
        <p id="searchHint" style="display:none; font-size:0.8rem; color:#6b7280; margin-top:6px; text-align:center;"></p>
    </div>

    <div class="filter-bar">
        <button class="filter-pill" id="filter-activeOnly" onclick="toggleFilter('activeOnly')"><span class="dot-active"></span> Active Now</button>
        <button class="filter-pill" id="filter-uniParcelsOnly" onclick="toggleFilter('uniParcelsOnly')">🎓 UniParcels</button>

        <div class="filter-divider"></div>

        <button class="filter-pill svc-pill active" data-tag="" onclick="setServiceFilter('')">All Services</button>
        <button class="filter-pill svc-pill" data-tag="Beli Makanan" onclick="setServiceFilter('Beli Makanan')">Beli Makanan</button>
        <button class="filter-pill svc-pill" data-tag="Beli Barang" onclick="setServiceFilter('Beli Barang')">Beli Barang</button>
        <button class="filter-pill svc-pill" data-tag="Hantar Barang" onclick="setServiceFilter('Hantar Barang')">Hantar Barang</button>
        <button class="filter-pill svc-pill" data-tag="Parcels" onclick="setServiceFilter('Parcels')">Parcels</button>
        <button class="filter-pill svc-pill" data-tag="Fotocopy / Print" onclick="setServiceFilter('Fotocopy / Print')">Fotocopy / Print</button>
        <button class="filter-pill svc-pill" data-tag="Laundry" onclick="setServiceFilter('Laundry')">Laundry</button>
        <button class="filter-pill svc-pill" data-tag="COD" onclick="setServiceFilter('COD')">COD</button>

        <div class="filter-divider"></div>

        <button class="filter-pill krit-pill active" data-val="" onclick="setKriteriaFilter('')">Semua</button>
        <button class="filter-pill krit-pill" data-val="Wanita" onclick="setKriteriaFilter('Wanita')">Wanita</button>
        <button class="filter-pill krit-pill" data-val="Lelaki" onclick="setKriteriaFilter('Lelaki')">Lelaki</button>
    </div>

    <div id="runnerGrid" class="runner-grid">
        <!-- Skeleton Loaders -->
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
</div>

<script>
    const DATA_SOURCE = "runners.json"; // This file will be generated by GitHub Actions
    let allRunners = [];

    async function loadRunners() {
        try {
            const response = await fetch(DATA_SOURCE);
            const all = await response.json();
            allRunners = all.filter(r => String(r.isTest).toLowerCase() !== 'true');
            applyFilters();
        } catch (e) {
            console.error("Failed to load runners. Ensure runners.json exists.");
        }
    }

    function isExpired(validUntil) {
        if (!validUntil) return false;
        const d = new Date(validUntil);
        if (isNaN(d)) return false;
        const endOfMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59);
        return new Date() > endOfMonth;
    }

    function renderGrid(data) {
        const grid = document.getElementById('runnerGrid');
        grid.innerHTML = data.map(runner => `
            <a href="profile?id=${runner.runnerId}" class="runner-card">
                <img src="${runner.profilePic}" class="card-img" alt="${runner.name}">
                <span class="card-name">${runner.name}</span>
                <span class="grid-id">${runner.runnerId}</span>
                ${String(runner.isUniParcels).toLowerCase() === 'true' ? '<span class="uniparcels-mini">🎓 UniParcels</span>' : ''}
                ${isExpired(runner.validUntil) ? '<span class="expired-mini">Tamat Tempoh</span>' : ''}
                <div style="margin-top:8px; font-size: 0.75rem;">
                    <span class="grid-status ${String(runner.isActive).toLowerCase() === 'true' ? 'status-online' : ''}"></span>
                    ${String(runner.isActive).toLowerCase() === 'true' ? 'Active Now' : 'Offline'}
                </div>
            </a>
        `).join('');
    }

    let activeFilters = { activeOnly: false, uniParcelsOnly: false, serviceTag: '', kriteria: '' };

    function applyFilters() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        let result = allRunners;

        if (activeFilters.activeOnly)
            result = result.filter(r => String(r.isActive).toLowerCase() === 'true');
        if (activeFilters.uniParcelsOnly)
            result = result.filter(r => String(r.isUniParcels).toLowerCase() === 'true');
        if (activeFilters.serviceTag)
            result = result.filter(r => (r.tags || '').toLowerCase().includes(activeFilters.serviceTag.toLowerCase()));
        if (activeFilters.kriteria)
            result = result.filter(r => (r.kriteriaP || '').toLowerCase() === activeFilters.kriteria.toLowerCase());

        if (term) {
            result = result.filter(r =>
                r.name.toLowerCase().includes(term) ||
                r.description.toLowerCase().includes(term) ||
                (r.tags || '').toLowerCase().includes(term) ||
                (r.kawasan || '').toLowerCase().includes(term) ||
                (r.runnerId || '').toLowerCase().includes(term) ||
                (r.availability || '').toLowerCase().includes(term) ||
                (r.kriteriaP || '').toLowerCase().includes(term)
            );
        }

        renderGrid(result);
        updateSearchHint(document.getElementById('searchInput').value, result.length);
    }

    function toggleFilter(key) {
        activeFilters[key] = !activeFilters[key];
        document.getElementById('filter-' + key).classList.toggle('active', activeFilters[key]);
        applyFilters();
    }

    function setServiceFilter(tag) {
        activeFilters.serviceTag = tag;
        document.querySelectorAll('.svc-pill').forEach(el =>
            el.classList.toggle('active', el.dataset.tag === tag)
        );
        applyFilters();
    }

    function setKriteriaFilter(val) {
        activeFilters.kriteria = val;
        document.querySelectorAll('.krit-pill').forEach(el =>
            el.classList.toggle('active', el.dataset.val === val)
        );
        applyFilters();
    }

    const KNOWN_KEYWORDS = [
        'Beli Makanan', 'Beli Barang', 'Hantar Barang', 'Parcels',
        'Fotocopy / Print', 'Laundry', 'COD',
        'Perempuan Sahaja', 'Lelaki Sahaja',
        'Dalam Kampus Sahaja', 'Dalam dan Luar Kampus',
        '24 Jam', 'Waktu Siang', 'Waktu Malam', 'Hujung Minggu',
        'Wanita', 'Lelaki', 'Terbuka'
    ];

    function updateSearchHint(term, count) {
        const hint = document.getElementById('searchHint');
        if (!term) { hint.style.display = 'none'; return; }

        const t = term.toLowerCase();
        const match = KNOWN_KEYWORDS.find(k => k.toLowerCase().includes(t) && k.toLowerCase() !== t);

        let text;
        if (count === 0) {
            text = `No results for: "${term}"`;
        } else if (match) {
            text = `Showing ${count} results for: ${term} > ${match}`;
        } else {
            text = `Showing ${count} results for: "${term}"`;
        }

        hint.textContent = text;
        hint.style.display = 'block';
    }

    // Search Logic
    document.getElementById('searchInput').addEventListener('input', () => applyFilters());

    loadRunners();
</script>
</body>
</html>
