name: Sync Google Sheet to JSON
on:
  workflow_dispatch: # Triggered externally via cron-job.org every 5 minutes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Fetch Main Sheet
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5oV-cl-4vxbKj_i-fzDravkHoGa6SUc-GYi8c2pv8NUKQSxtZv17vW0IWguQFfEqbWZburb_9FyCJ/pub?gid=0&single=true&output=csv" -o data.csv

      - name: Fetch Current Status
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vR04Q87P-owm0Z09Z6BWvGyYhsOzPQJzLw_nlG3loxsB5YHkxFy11YqkQ4G_X4ZWu8p3-r_II2_qyq-/pub?gid=1597133470&single=true&output=csv" -o current_status.csv

      - name: Convert CSV to JSON
        shell: python
        run: |
          import csv, json

          with open('data.csv', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))

          status_map = {}
          try:
              with open('current_status.csv', encoding='utf-8') as f:
                  for row in csv.DictReader(f):
                      runner_id = row.get('runnerId', '').strip()
                      is_active = row.get('isActive', '').strip()
                      if runner_id and is_active in ('TRUE', 'FALSE'):
                          status_map[runner_id] = is_active
          except FileNotFoundError:
              pass

          for row in rows:
              if row.get('runnerId') in status_map:
                  row['isActive'] = status_map[row['runnerId']]

          with open('runners.json', 'w', encoding='utf-8') as f:
              json.dump(rows, f, indent=2)

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add runners.json
          git commit -m "Auto-sync runner data" || exit 0
          git push
