name: Sync Google Sheet to JSON
on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Fetch Data
        run: |
          # Replace with your Published CSV URL
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5oV-cl-4vxbKj_i-fzDravkHoGa6SUc-GYi8c2pv8NUKQSxtZv17vW0IWguQFfEqbWZburb_9FyCJ/pub?gid=0&single=true&output=csv" -o data.csv

      - name: Convert CSV to JSON
        shell: python
        run: |
          import csv, json
          with open('data.csv', encoding='utf-8') as f:
              # Use DictReader to automatically map headers
              reader = csv.DictReader(f)
              rows = list(reader)
          with open('runners.json', 'w', encoding='utf-8') as f:
              json.dump(rows, f, indent=2)

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add runners.json
          git commit -m "Auto-sync runner data" || exit 0
          git push